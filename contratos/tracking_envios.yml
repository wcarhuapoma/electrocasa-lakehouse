fuente: tracking_envios
version: 2
ultima_actualizacion: '2026-11-24'
responsable: Logística / courier
llegada: Azure SQL Database, tabla dbo.TrackingEnvios
metodo_ingesta: Lakeflow Connect query-based SQL Server
connection_unity_catalog: electrocasa_sqlserver
cursor: fecha_modificacion
modo_historia: SCD Tipo 1 por evento_id; tracking_id conserva sus múltiples eventos.
frecuencia_esperada: Por corrida del job, con cursor persistente
tabla_bronze: <catalogo>.bronze.tracking_envios
tabla_silver: <catalogo>.silver.tracking_envios
llave: evento_id
depende_de:
- silver.ventas
columnas:
- nombre: evento_id
  tipo: int
  nulo: false
- nombre: tracking_id
  tipo: string
  nulo: false
- nombre: venta_id
  tipo: string
  nulo: false
  regla: Referencia evaluada al actualizar Silver.
- nombre: courier
  tipo: string
  nulo: false
  valores_permitidos:
  - olva_courier
  - servientrega
  - shalom
- nombre: estado_entrega
  tipo: string
  nulo: false
  valores_permitidos:
  - pendiente
  - en_transito
  - entregado
  - devuelto
- nombre: sucursal_origen
  tipo: string
  nulo: true
  regla: Columna del origen excluida de la proyección del conector.
- nombre: fecha_actualizacion
  tipo: date
  nulo: true
- nombre: fecha_modificacion
  tipo: timestamp
  nulo: false
reglas_de_calidad:
- nombre: estado_conocido
  condicion: coalesce((estado_entrega IS NOT NULL), false)
  politica: drop
  destino_rechazos: silver.cuarentena
  justificacion: Protege las métricas y la integridad de las claves.
- nombre: courier_conocido
  condicion: coalesce((courier IS NOT NULL), false)
  politica: drop
  destino_rechazos: silver.cuarentena
  justificacion: Evita agrupar eventos bajo un courier fuera del catálogo permitido.
- nombre: evento_asociado
  condicion: coalesce((evento_id IS NOT NULL AND tracking_id IS NOT NULL AND
    fecha_modificacion IS NOT NULL AND _venta_valida), false)
  politica: drop
  destino_rechazos: silver.cuarentena
  justificacion: Protege las métricas y la integridad de las claves.
transformaciones_silver:
- Estandarizar estados y deduplicar por envío, estado y fecha del cambio.
- Unificar Olva y Olva Courier bajo olva_courier. Normalizar el casing de Servientrega y Shalom.
problemas_conocidos:
- problema: Estados inconsistentes y cambios de estado reprocesados
  ejemplo: En camino / EN_CAMINO
  filas_afectadas: 2.648 eventos usaron alguna variante de En camino en Bronze.
  tratamiento: Estandarizar estados y deduplicar por envío, estado y fecha del cambio.
