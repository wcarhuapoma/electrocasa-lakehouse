fuente: resenas
version: 2
ultima_actualizacion: '2026-11-24'
responsable: Experiencia del cliente
llegada: JSON Lines en /Volumes/<catalogo>/default/vol_landing/resenas/
metodo_ingesta: Auto Loader para lotes de objetos JSON
frecuencia_esperada: Por lote de la fuente
tabla_bronze: <catalogo>.bronze.resenas
tabla_silver: <catalogo>.silver.resenas
llave: resena_id
depende_de:
- silver.catalogo_categorias
columnas:
- nombre: resena_id
  tipo: string
  nulo: false
- nombre: producto_id
  tipo: string
  nulo: false
  regla: Referencia evaluada al actualizar Silver.
- nombre: cliente_id
  tipo: string
  nulo: true
- nombre: calificacion
  tipo: int
  nulo: false
  regla: Entero entre 1 y 5
- nombre: comentario
  tipo: string
  nulo: true
- nombre: tags
  tipo: array<string>
  nulo: true
- nombre: respuestas
  tipo: array<struct<autor:string,texto:string,fecha:string>>
  nulo: true
- nombre: fecha_resena
  tipo: date
  nulo: false
- nombre: metadata
  tipo: string
  nulo: true
reglas_de_calidad:
- nombre: calificacion_en_escala
  condicion: coalesce((calificacion BETWEEN 1 AND 5), false)
  politica: drop
  destino_rechazos: silver.cuarentena
  justificacion: Protege las métricas y la integridad de las claves.
- nombre: resena_asociada
  condicion: coalesce((resena_id IS NOT NULL AND fecha_resena IS NOT NULL AND _producto_existe),
    false)
  politica: drop
  destino_rechazos: silver.cuarentena
  justificacion: Excluye fechas o claves inválidas y productos ausentes de los snapshots.
- nombre: categoria_actual_valida
  condicion: coalesce((NOT _producto_existe OR _categoria_valida), false)
  politica: drop
  destino_rechazos: silver.cuarentena
  justificacion: La reseña del producto presente requiere una categoría válida en su último snapshot.
transformaciones_silver:
- Validar en Silver y conservar metadata como texto JSON.
- Validar la categoría sin depender del precio del catálogo comercial.
problemas_conocidos:
- problema: Calificaciones fuera de escala y metadatos heterogéneos
  ejemplo: Calificación 0 o 6
  filas_afectadas: 103 calificaciones fuera de escala o nulas en Bronze.
  tratamiento: Validar en Silver y conservar metadata como texto JSON.
